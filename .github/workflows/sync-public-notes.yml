name: Synchronize StatM public notes
on:
  push:
    branches: [main]
    paths: ['.github/public-notes.json']
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update user-facing release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'Lewis-18/StatM'
          commit = os.environ['GITHUB_SHA']
          with urllib.request.urlopen(f'https://raw.githubusercontent.com/{repo}/{commit}/.github/public-notes.json', timeout=30) as response:
              plan = json.load(response)
          def api(route, body=None):
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/{route}', data=data,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'StatM-release'},
                  method='PATCH' if body is not None else 'GET')
              with urllib.request.urlopen(request, timeout=60) as response: return json.load(response)
          for expected in plan:
              release = api('releases/' + str(expected['id']))
              assert release['tag_name'] == expected['tag'] and release['draft'] is False
              actual = release['body'].replace('\r\n', '\n')
              current_hash = hashlib.sha256(actual.encode()).hexdigest()
              assert current_hash == expected['expectedPreviousHash'] or actual == expected['body'], 'Release was edited after review'
              for asset in expected['assets']:
                  found = next(a for a in release['assets'] if a['name'] == asset['name'])
                  assert found['size'] == asset['size'] and found.get('digest') == asset.get('digest')
              if actual != expected['body']:
                  updated = api('releases/' + str(release['id']), {'body': expected['body']})
                  assert updated['body'].replace('\r\n', '\n') == expected['body']
              print('User-facing notes verified: ' + expected['tag'])

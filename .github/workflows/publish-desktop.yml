name: Publish verified desktop installer
on:
  push:
    branches: [main]
    paths: ['.github/release-input.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verify and publish the tested installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, re, time, urllib.request, urllib.error
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.parse import urlparse, quote
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'Lewis-18/StatM'
          commit = os.environ['GITHUB_SHA']
          manifest_url = f'https://raw.githubusercontent.com/{repo}/{commit}/.github/release-input.json'
          with urllib.request.urlopen(manifest_url, timeout=30) as response:
              manifest = json.load(response)
          version = manifest['version']
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version)
          name = f'StatM-Setup-{version}-x64.exe'
          assert manifest['artifact'] == name and manifest['verification'] == 'PASS'
          expected = manifest['sha256']
          assert re.fullmatch('[a-f0-9]{64}', expected)
          source = urlparse(manifest['source_url'])
          assert source.scheme == 'https' and source.hostname.endswith('.trycloudflare.com') and not source.username
          assert 1_000_000 < manifest['size'] < 500_000_000
          target = Path(name)
          for attempt in range(4):
              try:
                  chunk_size = 8 * 1024 * 1024
                  parts = list(range(0, manifest['size'], chunk_size))
                  def download_part(start):
                      end = min(start + chunk_size, manifest['size']) - 1
                      request = urllib.request.Request(manifest['source_url'], headers={'Range': f'bytes={start}-{end}'})
                      part = Path(f'part-{start}')
                      with urllib.request.urlopen(request, timeout=120) as response, part.open('wb') as output:
                          assert response.status == 206
                          assert response.headers['Content-Range'] == f'bytes {start}-{end}/{manifest["size"]}'
                          count = 0
                          while chunk := response.read(1024 * 1024):
                              count += len(chunk)
                              assert count <= end - start + 1
                              output.write(chunk)
                      assert count == end - start + 1
                      print(f'Verified transfer chunk {start}-{end}', flush=True)
                      return part
                  with ThreadPoolExecutor(max_workers=6) as pool:
                      downloaded = list(pool.map(download_part, parts))
                  with target.open('wb') as output:
                      for part in downloaded:
                          with part.open('rb') as stream:
                              while chunk := stream.read(1024 * 1024): output.write(chunk)
                  assert target.stat().st_size == manifest['size']
                  with target.open('rb') as stream:
                      actual = hashlib.file_digest(stream, 'sha256').hexdigest()
                  assert actual == expected, 'Installer does not match the verified artifact'
                  break
              except Exception:
                  if attempt == 3: raise
                  time.sleep(10)
          def api(route, method='GET', body=None, binary=None):
              url = route if route.startswith('https://') else f'https://api.github.com/repos/{repo}/{route}'
              assert urlparse(url).hostname in ['api.github.com', 'uploads.github.com']
              headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'StatM-release'}
              data = json.dumps(body).encode() if body is not None else binary
              headers['Content-Type'] = 'application/json' if binary is None else 'application/octet-stream'
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=300) as response:
                  return json.load(response)
          tag = 'v' + version
          try:
              release = api('releases/tags/' + tag)
          except urllib.error.HTTPError as error:
              if error.code != 404: raise
              release = api('releases', 'POST', {'tag_name': tag, 'target_commitish': commit, 'name': 'StatM ' + version, 'body': manifest['notes'], 'draft': True, 'prerelease': False})
          if not release['draft']:
              asset = next(a for a in release['assets'] if a['name'] == name)
              assert asset['size'] == manifest['size'] and asset.get('digest') == 'sha256:' + expected
              print('Verified release already published: ' + release['html_url'])
          else:
              for asset in release['assets']:
                  if asset['name'] in [name, 'SHA256SUMS.txt']:
                      api('releases/assets/' + str(asset['id']), 'DELETE')
              upload = release['upload_url'].split('{')[0]
              asset = api(upload + '?name=' + quote(name), 'POST', binary=target.read_bytes())
              assert asset['size'] == manifest['size'] and asset['state'] == 'uploaded'
              assert asset.get('digest') == 'sha256:' + expected
              api(upload + '?name=SHA256SUMS.txt', 'POST', binary=(expected + '  ' + name + '\n').encode())
              published = api('releases/' + str(release['id']), 'PATCH', {'draft': False, 'make_latest': 'true'})
              assert published['draft'] is False
              print('Published verified installer: ' + published['html_url'])

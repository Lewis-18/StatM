name: Finalize StatM release notes
on:
  push:
    branches: [main]
    paths: ['.github/releases/v1.0.8.json']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Synchronize verified release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          assert repo == 'Lewis-18/StatM'
          commit = os.environ['GITHUB_SHA']
          with urllib.request.urlopen(f'https://raw.githubusercontent.com/{repo}/{commit}/.github/releases/v1.0.8.json', timeout=30) as response:
              expected = json.load(response)
          assert expected['tag_name'] == 'v1.0.8'
          def api(route, body=None):
              data = json.dumps(body).encode() if body is not None else None
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/{route}', data=data,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'StatM-release'},
                  method='PATCH' if body is not None else 'GET')
              with urllib.request.urlopen(request, timeout=60) as response: return json.load(response)
          release = api('releases/tags/v1.0.8')
          assert release['draft'] is False and release['prerelease'] is False
          for asset in expected['assets']:
              actual = next(a for a in release['assets'] if a['name'] == asset['name'])
              assert actual['size'] == asset['size'] and actual['digest'] == asset['digest']
          updated = api('releases/' + str(release['id']), {'body': expected['body']})
          assert updated['body'] == expected['body']
          print('Release notes synchronized; existing installer assets preserved.')

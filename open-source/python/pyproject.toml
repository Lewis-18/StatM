[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statm-tools"
version = "1.0.8"
description = "Tabular data readers and statistical tools"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.15,<2", "matplotlib>=3.9,<4", "statsmodels>=0.14,<1", "pingouin>=0.5,<1", "fastapi>=0.115,<1", "pydantic>=2,<3", "openpyxl>=3.1,<4", "xlrd>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "xlwt==1.3.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["statm_tools*"]
